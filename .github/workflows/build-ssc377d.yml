name: Build OpenIPC SSC377D IMX335 + RTL8812EU/RTL8731BU + wfb-ng + New WebUI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ssc377d.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout OpenIPC firmware
        uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl unzip python3 python3-pip rsync bc cpio gzip tar xz-utils \
            libncurses5-dev libssl-dev flex bison gettext ccache kmod

      - name: List available boards (debug)
        run: |
          echo "=== Available boards in sigmastar ==="
          ls -la br-ext-chip-sigmastar/configs/*_defconfig | sed 's/.*\///; s/_defconfig$//'
          echo "=== All boards ==="
          find br-ext-chip-*/configs -name '*_defconfig' -exec basename {} \; | sed 's/_defconfig$//' | sort

      - name: Prepare defconfig for SSC377D IMX335
        run: |
          # Copy lite defconfig to new custom defconfig
          cp br-ext-chip-sigmastar/configs/ssc377d_lite_defconfig br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig
          
          # Add required packages via Kconfig fragments
          {
            echo '# WiFi drivers'
            echo 'BR2_PACKAGE_RTL8812EU_OPENIPC=y'
            echo 'BR2_PACKAGE_RTL8733BU_OPENIPC=y'
            echo 'BR2_PACKAGE_RTL88XXAU_OPENIPC=y'
            echo ''
            echo '# wfb-ng'
            echo 'BR2_PACKAGE_WFB_NG=y'
            echo 'BR2_PACKAGE_WFB_NG_TOOLS=y'
            echo ''
            echo '# Telemetry & OSD'
            echo 'BR2_PACKAGE_MSPOSD=y'
            echo 'BR2_PACKAGE_MAVLINK_ROUTER=y'
            echo 'BR2_PACKAGE_MAVLINK_ROUTER_MAVLINK=y'
            echo ''
            echo '# New WebUI (Vue.js)'
            echo 'BR2_PACKAGE_OPENIPC_WEBUI=y'
            echo ''
            echo '# FPV specific'
            echo 'BR2_PACKAGE_OPENIPC_FPV=y'
            echo 'BR2_PACKAGE_MAJESTIC_FONTS=y'
            echo 'BR2_PACKAGE_MAJESTIC_WEBUI=y'
            echo ''
            echo '# Network tools'
            echo 'BR2_PACKAGE_IW=y'
            echo 'BR2_PACKAGE_WIRELESS_TOOLS=y'
            echo 'BR2_PACKAGE_WPA_SUPPLICANT=y'
            echo 'BR2_PACKAGE_WPA_SUPPLICANT_CLI=y'
          } >> br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig

      - name: Verify defconfig created
        run: |
          echo "=== Created defconfig ==="
          cat br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig
          echo "=== File exists ==="
          ls -la br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig

      - name: Build firmware
        run: |
          # Try with the exact board name
          make BOARD=ssc377d_fpv_wfbng defconfig
          make -j$(nproc)

      - name: Find and verify output
        run: |
          find output/images -name "*.sysupgrade*" -o -name "*.tgz" -o -name "*.img" | head -20
          ls -la output/images/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openipc-ssc377d-imx335-wfbng-webui
          path: |
            output/images/*.sysupgrade*
            output/images/*.tgz
            output/images/*.img
          retention-days: 7

      - name: Print firmware info
        run: |
          echo "Build completed!"
          echo "Download artifact from Actions tab: openipc-ssc377d-imx335-wfbng-webui"
          echo "Flash with: sysupgrade -v openipc-ssc377d-*.sysupgrade.bin"
