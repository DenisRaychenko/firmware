name: Build OpenIPC SSC377D IMX335 + RTL8812EU/RTL8731BU + wfb-ng + FULL WebUI (8MB)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ssc377d.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BOARD: ssc377d_fpv_wfbng
    steps:
      - name: Checkout OpenIPC firmware
        uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl unzip python3 python3-pip rsync bc cpio gzip tar xz-utils \
            libncurses5-dev libssl-dev flex bison gettext ccache kmod

      - name: List available boards (debug)
        run: |
          echo "=== Available boards in sigmastar ==="
          ls -la br-ext-chip-sigmastar/configs/*_defconfig | sed 's/.*\///; s/_defconfig$//'
          echo "=== All boards ==="
          find br-ext-chip-*/configs -name '*_defconfig' -exec basename {} \; | sed 's/_defconfig$//' | sort

      - name: Prepare defconfig for SSC377D IMX335 (FULL 8MB build)
        run: |
          # Copy lite defconfig to new custom defconfig
          cp br-ext-chip-sigmastar/configs/ssc377d_lite_defconfig br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig

          # ssc377d_lite_defconfig ships BR2_OPENIPC_FLASH_SIZE="8", which the top-level
          # Makefile's repack rule reads as "cap the squashfs at 5120KB". `cat /proc/mtd` on
          # the real camera says otherwise: mtd3 "rootfs" is 0x800000 = 8192KB on its own, and
          # summing every partition (boot 256K + env 64K + kernel 2048K + rootfs 8192K +
          # rootfs_data 5824K) gives a 16MB chip, not 8MB. This is a stale/wrong value for this
          # specific board's real hardware, not a real 5120KB ceiling we need to fit under -
          # every package trim so far (NFS/WireGuard kernel modules, extra sensor blobs, unused
          # audio-adjacent packages) was fighting a phantom limit. FLASH_SIZE only feeds this
          # build-time repack size check, not the live device's already-fixed partition table
          # (that comes from U-Boot's own mtdparts bootarg, set independently of what firmware
          # was built with) - overriding it here is safe.
          sed -i 's/BR2_OPENIPC_FLASH_SIZE="8"/BR2_OPENIPC_FLASH_SIZE="16"/' br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig

          # The vendor kernel config (br-ext-chip-sigmastar/board/infinity6c/infinity6c-ssc027a.config)
          # builds NFS-client + SunRPC + WireGuard as modules unconditionally - none of it is a
          # Buildroot package toggle, so it can't be turned off from the defconfig additions below.
          # This project uses neither (no NFS mounts, no WireGuard tunnels - ground<->air uses
          # wfb_tun instead), and together they're ~600KB of the squashfs overage. Layer a small
          # fragment on top via BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES instead of editing the
          # vendor file directly.
          cat > openipc-fpv-trim.fragment << 'EOF'
          # CONFIG_NFS_FS is not set
          # CONFIG_SUNRPC is not set
          # CONFIG_WIREGUARD is not set
          EOF

          # Trimmed package set to fit the 5120KB squashfs cap enforced by repack
          # for this board (the "FULL WebUI" set exceeded it by ~1MB - Vue WebUI
          # and duplicate WiFi drivers dropped). Dropbear (SSH) is NOT touched -
          # it stays on via the ssc377d_lite_defconfig base.
          {
            echo '# WiFi driver - real chipset on this camera (BL-M8812EU2 = RTL8812EU family).'
            echo '# RTL8812EU_OPENIPC does not exist as a Kconfig symbol in this repo - it was'
            echo '# silently ignored by a prior build, producing no driver module at all.'
            echo '# The correct package for this chipset is rtl88x2eu-openipc.'
            echo 'BR2_PACKAGE_RTL88X2EU_OPENIPC=y'
            echo ''
            echo '# wfb-ng. BR2_PACKAGE_WFB_NG/_TOOLS do not exist as Kconfig symbols in'
            echo '# this repo either (same class of mistake as RTL8812EU_OPENIPC above) -'
            echo '# silently produced zero wfb_rx/wfb_tx/wfb_tun binaries on the previous'
            echo '# build, confirmed on-camera after flashing (find / -iname "wfb*" found'
            echo '# only the leftover /etc/wfb.yaml, no binaries at all). The real package'
            echo '# is wifibroadcast-ng, which also pulls in mavfwd/jsonfilter/yaml-cli-multi.'
            echo 'BR2_PACKAGE_WIFIBROADCAST_NG=y'
            echo ''
            echo '# Telemetry & OSD'
            echo 'BR2_PACKAGE_MSPOSD=y'
            echo ''
            echo '# Fonts only (needed for OSD text rendering)'
            echo 'BR2_PACKAGE_MAJESTIC_FONTS=y'
            echo ''
            echo '# Network tools'
            echo 'BR2_PACKAGE_IW=y'
            echo ''
            echo '# FPV specific'
            echo 'BR2_PACKAGE_OPENIPC_FPV=y'
            echo ''
            echo '# The ssc377d_lite_defconfig base turns these ON, and appending more'
            echo '# BR2_x=y lines to the same file does not unset anything already on -'
            echo '# only an explicit "is not set" line does. None of these are used by'
            echo '# this project (managed-mode WPA/wireless-tools - we drive the radio in'
            echo '# monitor mode via a custom script; exFAT - a USB-drive filesystem, this'
            echo '# camera has no USB storage; WireGuard/vtund VPN tunneling - unused;'
            echo '# the Vue WebUI - already dropped above) and together were the actual'
            echo '# 572KB pushing the squashfs over its 5120KB cap - back when the cap was'
            echo '# really 5120KB. After the real fix (BR2_OPENIPC_FLASH_SIZE below, giving'
            echo '# 2.7MB of headroom) MAJESTIC_WEBUI was left disabled anyway and majestic'
            echo '# started serving 500s for its web root - it is not optional, put it back.'
            echo 'BR2_PACKAGE_MAJESTIC_WEBUI=y'
            echo '# BR2_PACKAGE_WPA_SUPPLICANT is not set'
            echo '# BR2_PACKAGE_WPA_SUPPLICANT_CLI is not set'
            echo '# BR2_PACKAGE_WPA_SUPPLICANT_PASSPHRASE is not set'
            echo '# BR2_PACKAGE_WIRELESS_TOOLS is not set'
            echo '# BR2_PACKAGE_EXFATPROGS is not set'
            echo '# BR2_PACKAGE_EXFAT_OPENIPC is not set'
            echo '# BR2_PACKAGE_WIREGUARD_TOOLS is not set'
            echo '# majestic.yaml has audio.enabled: false on this camera - no mic is'
            echo '# wired up, only the video/OSD path matters here'
            echo '# BR2_PACKAGE_OPUS_OPENIPC is not set'
            echo '# BR2_PACKAGE_OPUS_OPENIPC_FIXED_POINT is not set'
            echo '# BR2_PACKAGE_LIBOGG_OPENIPC is not set'
            echo '# BR2_PACKAGE_VTUND_OPENIPC is not set'
            echo '# ipctool was disabled here in an earlier round of trimming, on the wrong'
            echo '# assumption that it'"'"'s just a diagnostic CLI nobody calls. It is not: '"'"'S70vendor'"'"''
            echo '# runs `vendor=$(ipcinfo -v); load_"$vendor" -i` unconditionally at boot, and'
            echo '# load_sigmastar itself calls `ipcinfo -s` for sensor autodetect whenever it'
            echo '# runs without a persisted U-Boot sensor env var. Without it, mi.ko/the sensor'
            echo '# module never load and majestic can'"'"'t open /dev/mi/sys at all - confirmed by'
            echo '# flashing this exact mistake and watching majestic die with "Cannot start SDK"'
            echo '# until ipcinfo was available again. We have 2.7MB of headroom after the real'
            echo '# fix (see BR2_OPENIPC_FLASH_SIZE below) - there was never a real need to cut this.'
            echo ''
            echo '# Trim the vendor kernel'"'"'s unconditional NFS/SunRPC/WireGuard modules (see the'
            echo '# comment above where the fragment file is written). Must be an absolute path -'
            echo '# the existence check that consumes this runs from a different cwd than the repo'
            echo '# root (confirmed: a bare relative filename here failed with "Kconfig file or'
            echo '# fragment ... does not exist" even though the file is right there at the top).'
            echo "BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES=\"$PWD/openipc-fpv-trim.fragment\""
            echo ''
            echo '# sigmastar-osdrv-infinity6c ships /etc/sensors/*.bin for every sensor this'
            echo '# SoC family supports (gc4653/imx335/imx415/os04a10/sc401ai/sc830ai) unless'
            echo '# told which one to keep. This camera has only ever used imx335 (confirmed'
            echo '# live: /etc/majestic.yaml sensorConfig: /etc/sensors/imx335.bin) - also fixes'
            echo '# a latent bug found while checking this: the live camera'"'"'s majestic.yaml'
            echo '# pointed at /etc/sensors/imx335_infinity6c.bin, a file that has never existed'
            echo '# in this package (it only ever ships bare imx335.bin) - AE/AWB calibration'
            echo '# was silently running without its sensor config. Fixed directly on the camera'
            echo '# too, independent of this rebuild.'
            echo 'BR2_OPENIPC_SNS_MODEL="imx335"'
            echo ''
            echo '# 200KB CA bundle, pulled in for libcurl'"'"'s TLS validation of https:// URLs.'
            echo '# We only ever use curl for http://localhost (majestic'"'"'s own config API,'
            echo '# wifibroadcast-ng'"'"'s files/wifibroadcast script) and flash via a local'
            echo '# sysupgrade --archive=, never the online-update https:// path.'
            echo '# BR2_PACKAGE_CA_CERTIFICATES is not set'
          } >> br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig

      - name: Verify defconfig created
        run: |
          echo "=== Created defconfig ==="
          cat br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig
          echo "=== File exists ==="
          ls -la br-ext-chip-sigmastar/configs/ssc377d_fpv_wfbng_defconfig

      - name: Build firmware (without repack, so we can size-report first)
        run: |
          make BOARD=${{ env.BOARD }} defconfig
          make BOARD=${{ env.BOARD }} build -j$(nproc)

      - name: Drop the CA cert bundle directly from the built target
        run: |
          # BR2_PACKAGE_CA_CERTIFICATES is not a real Kconfig symbol in this repo either
          # (same class of mistake as RTL8812EU_OPENIPC/WFB_NG earlier - the negation line
          # sat in the defconfig and did nothing, confirmed: byte-identical rootfs size with
          # and without it). We only ever curl http://localhost - never the online https://
          # update path - so nothing needs it.
          #
          # Repack doesn't reuse output/target - it re-derives its own squashfs-specific
          # target tree by rsyncing straight from every package's own
          # output/per-package/<pkg>/target/ (confirmed from an earlier repack's own log:
          # "rsync ... per-package/dropbear-openipc/target/ ... output/target"), so deleting
          # only the merged output/target copy would get silently re-introduced when Repack
          # re-merges. Delete it everywhere it appears instead.
          find output/target output/per-package -path '*/target/etc/ssl/certs/ca-certificates.crt' -print -delete 2>&1 || true

      - name: Size report (what is actually taking the space)
        run: |
          make BOARD=${{ env.BOARD }} size-report || true
          cat output/images/sizes.ssc377d-lite.json | python3 -m json.tool || cat output/images/sizes.ssc377d-lite.json

      - name: Repack
        run: |
          make BOARD=${{ env.BOARD }} repack-final

      - name: Check build result and rootfs size
        run: |
          echo "=== Build output ==="
          find output/images -name "*.sysupgrade*" -o -name "*.tgz" -o -name "*.img" -o -name "*.squashfs" | head -20
          ls -la output/images/
          echo "=== Checking squashfs size ==="
          if ls output/images/*.squashfs 1> /dev/null 2>&1; then
            du -h output/images/*.squashfs
          fi
          if ls output/images/rootfs.squashfs 1> /dev/null 2>&1; then
            du -h output/images/rootfs.squashfs
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openipc-ssc377d-imx335-wfbng-full-8mb
          path: |
            output/images/*.sysupgrade*
            output/images/*.tgz
            output/images/*.img
            output/images/*.squashfs
          retention-days: 7

      - name: Print firmware info
        run: |
          echo "Build completed!"
          echo "Download artifact: openipc-ssc377d-imx335-wfbng-full-8mb"
          echo "Flash with: sysupgrade -v openipc-ssc377d-*.sysupgrade.bin"
          echo ""
          echo "IMPORTANT: After flashing, update U-Boot env to use 8MB rootfs:"
          echo "  fw_setenv bootargs 'console=ttyS0,115200 panic=20 root=/dev/mtdblock3 init=/init mtdparts=NOR_FLASH:256k(boot),64k(env),2048k(kernel),8192k(rootfs),-(rootfs_data) LX_MEM=0x8000000 mma_heap=mma_heap_name0,miu=0,sz=0x4600000 cma=2M rootmtd=8192k'"
